<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi - INALUM</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-inalum-dashboard.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { inalum: { blue: '#0A457F', bluehover: '#083663' } } } } };
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-[Satoshi]">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 w-full max-w-md">
        <div class="text-center mb-6">
            <img src="/logo-inalum-login.png" alt="INALUM" class="h-10 mx-auto mb-5">
            <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Lupa Kata Sandi</h2>
            <p class="text-sm text-gray-500 mt-2">Masukkan email Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi.</p>
        </div>
        
        <form id="forgotForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Alamat Email</label>
                <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-inalum-blue focus:border-inalum-blue outline-none transition-all text-sm" placeholder="email@contoh.com">
            </div>
            
            <button type="submit" class="w-full bg-inalum-blue text-white py-3 rounded-xl hover:bg-inalum-bluehover transition-colors font-medium shadow-sm">Kirim Tautan Reset</button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Ingat kata sandi? <a href="/login.html" class="text-inalum-blue hover:underline font-semibold">Kembali ke Login</a>
        </p>

        <div id="messageBox" class="mt-5 hidden p-4 rounded-xl text-sm text-center font-medium border"></div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = e.target.querySelector('button');
            const msgBox = document.getElementById('messageBox');
            
            btn.disabled = true;
            btn.innerText = 'Mengirim Tautan...';
            msgBox.classList.add('hidden');
            
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                msgBox.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-600', 'bg-green-50', 'border-green-200', 'text-green-600');
                if(res.ok) {
                    msgBox.classList.add('bg-green-50', 'border-green-200', 'text-green-600');
                    msgBox.innerText = data.message;
                    document.getElementById('email').value = '';
                } else {
                    msgBox.classList.add('bg-red-50', 'border-red-200', 'text-red-600');
                    msgBox.innerText = data.error || 'Terjadi kesalahan.';
                }
            } catch(err) {
                msgBox.classList.remove('hidden');
                msgBox.classList.add('bg-red-50', 'border-red-200', 'text-red-600');
                msgBox.innerText = 'Gagal terhubung ke server.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Kirim Tautan Reset';
            }
        });
    </script>
</body>
</html>
