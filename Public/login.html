<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Manajemen Pemadaman</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-inalum-dashboard.png">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#F8FAFC',
                        foreground: '#0F172A',
                        border: '#E2E8F0',
                        inalum: {
                            blue: '#0A457F',
                            bluehover: '#083663'
                        }
                    },
                    fontFamily: { sans: ['Satoshi', 'sans-serif'] },
                }
            }
        };
    </script>
</head>
<body class="bg-background text-foreground flex items-center justify-center h-screen p-4">

    <div class="bg-white p-8 rounded-3xl border border-border w-full max-w-md shadow-lg">
        <div class="text-center mb-8 flex flex-col items-center">
            <img src="/logo-inalum-login.png" alt="Logo INALUM" class="h-12 w-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold tracking-tight text-inalum-blue">Selamat Datang</h1>
            <p class="text-sm text-gray-500 mt-2">Masuk ke Dasbor Pemadaman</p>
        </div>

        <div id="alertMsg" class="hidden text-center text-sm font-medium p-3 rounded-xl mb-4"></div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Alamat Email</label>
                <input type="email" id="email" required class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors" placeholder="nama@email.com">
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs uppercase tracking-widest text-gray-500">Kata Sandi</label>
                    <a href="/forgot-password.html" class="text-xs font-medium text-inalum-blue hover:underline">Lupa Sandi?</a>
                </div>
                <input type="password" id="password" required class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors" placeholder="••••••••">
            </div>
            <button type="submit" id="btnSubmit" class="w-full bg-inalum-blue text-white py-3.5 rounded-full text-xs uppercase tracking-widest font-medium hover:bg-inalum-bluehover transition-colors shadow-sm">
                Masuk
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">Belum punya akun? <a href="/register.html" class="text-inalum-blue font-bold hover:underline">Daftar di sini</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('lastUsedEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('password').focus(); 
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const alertMsg = document.getElementById('alertMsg');
            const emailInput = document.getElementById('email').value;
            const passInput = document.getElementById('password').value;

            btn.innerText = "Memeriksa...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput, password: passInput })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('lastUsedEmail', emailInput);
                    alertMsg.innerText = "Login berhasil, mengarahkan...";
                    alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-green-100 text-green-700 border border-green-200 block";
                    window.location.href = data.redirect;
                } else {
                    alertMsg.innerText = data.error;
                    alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
                }
            } catch (err) {
                alertMsg.innerText = "Gagal terhubung ke server.";
                alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
            } finally {
                btn.innerText = "Masuk";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
