<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Sandi Baru - INALUM</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-inalum-dashboard.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { inalum: { blue: '#0A457F', bluehover: '#083663' } } } } };
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-[Satoshi]">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 w-full max-w-md">
        <div class="text-center mb-6">
            <img src="/logo-inalum-login.png" alt="INALUM" class="h-10 mx-auto mb-5">
            <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Buat Sandi Baru</h2>
            <p class="text-sm text-gray-500 mt-2">Silakan masukkan kata sandi baru untuk akun Anda.</p>
        </div>
        
        <form id="resetForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Kata Sandi Baru</label>
                <input type="password" id="newPassword" required minlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-inalum-blue focus:border-inalum-blue outline-none transition-all text-sm" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full bg-inalum-blue text-white py-3 rounded-xl hover:bg-inalum-bluehover transition-colors font-medium shadow-sm">Perbarui Kata Sandi</button>
        </form>

        <div id="messageBox" class="mt-5 hidden p-4 rounded-xl text-sm text-center font-medium border"></div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const btn = e.target.querySelector('button');
            const msgBox = document.getElementById('messageBox');
            
            // Mengambil Token unik dari URL (?token=xxxxx)
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                msgBox.classList.remove('hidden');
                msgBox.classList.add('bg-red-50', 'border-red-200', 'text-red-600');
                msgBox.innerText = 'Token tidak valid. Pastikan Anda membuka tautan langsung dari email.';
                return;
            }
            
            btn.disabled = true;
            btn.innerText = 'Memperbarui...';
            msgBox.classList.add('hidden');
            
            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await res.json();
                
                msgBox.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-600', 'bg-green-50', 'border-green-200', 'text-green-600');
                if(res.ok) {
                    msgBox.classList.add('bg-green-50', 'border-green-200', 'text-green-600');
                    msgBox.innerHTML = `${data.message} <br><a href="/login.html" class="underline mt-2 inline-block font-semibold">Login Sekarang</a>`;
                    e.target.reset();
                    btn.classList.add('hidden'); // Sembunyikan tombol jika sukses
                } else {
                    msgBox.classList.add('bg-red-50', 'border-red-200', 'text-red-600');
                    msgBox.innerText = data.error || 'Terjadi kesalahan.';
                    btn.disabled = false;
                    btn.innerText = 'Perbarui Kata Sandi';
                }
            } catch(err) {
                msgBox.classList.remove('hidden');
                msgBox.classList.add('bg-red-50', 'border-red-200', 'text-red-600');
                msgBox.innerText = 'Gagal terhubung ke server.';
                btn.disabled = false;
                btn.innerText = 'Perbarui Kata Sandi';
            }
        });
    </script>
</body>
</html>
