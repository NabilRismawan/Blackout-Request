<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi - Sistem Manajemen Pemadaman</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-inalum-dashboard.png">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#F8FAFC',
                        'background-soft': '#F1F5F9',
                        foreground: '#0F172A',
                        border: '#E2E8F0',
                        inalum: {
                            blue: '#0A457F',
                            bluehover: '#083663'
                        }
                    },
                    fontFamily: { sans: ['Satoshi', 'sans-serif'] },
                }
            }
        };
    </script>
</head>
<body class="bg-background text-foreground flex items-center justify-center h-screen p-4">

    <div class="bg-white p-8 rounded-3xl border border-border w-full max-w-md shadow-lg">
        <div class="text-center mb-8 flex flex-col items-center">
            <img src="/logo-inalum-login.png" alt="Logo INALUM" class="h-12 w-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold tracking-tight text-inalum-blue">Lupa Kata Sandi?</h1>
            <p class="text-sm text-gray-500 mt-2">Masukkan email terdaftar Anda untuk menerima tautan reset kata sandi.</p>
        </div>

        <div id="alertMsg" class="hidden text-center text-sm font-medium p-3 rounded-xl mb-4"></div>

        <form id="forgotForm" class="space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Alamat Email</label>
                <input type="email" id="email" required class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors" placeholder="nama@email.com">
            </div>
            
            <button type="submit" id="btnSubmit" class="w-full bg-inalum-blue text-white py-3.5 rounded-full text-xs uppercase tracking-widest font-medium hover:bg-inalum-bluehover transition-colors shadow-sm">
                Kirim Tautan Reset
            </button>
        </form>

        <div id="resendContainer" class="hidden mt-5 text-center p-4 bg-background-soft rounded-xl border border-border">
            <p class="text-xs text-gray-500 mb-2">Belum menerima email?</p>
            <button type="button" id="btnResend" disabled class="text-xs font-bold uppercase tracking-widest text-inalum-blue hover:underline opacity-50 cursor-not-allowed transition-all">
                Kirim Ulang Email (30s)
            </button>
        </div>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500"><a href="/login.html" class="text-inalum-blue font-bold hover:underline">&larr; Kembali ke halaman Login</a></p>
        </div>
    </div>

    <script>
        let countdownTimer;

        function startResendTimer() {
            const resendContainer = document.getElementById('resendContainer');
            const btnResend = document.getElementById('btnResend');
            
            resendContainer.classList.remove('hidden');
            btnResend.disabled = true;
            btnResend.classList.add('opacity-50', 'cursor-not-allowed');
            
            let timeLeft = 30;
            btnResend.innerText = `Kirim Ulang Email (${timeLeft}s)`;

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                btnResend.innerText = `Kirim Ulang Email (${timeLeft}s)`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    btnResend.disabled = false;
                    btnResend.classList.remove('opacity-50', 'cursor-not-allowed');
                    btnResend.innerText = "Kirim Ulang Email Sekarang";
                }
            }, 1000);
        }

        async function sendResetRequest(emailInput, isResend = false) {
            const btn = document.getElementById('btnSubmit');
            const alertMsg = document.getElementById('alertMsg');
            
            if (!isResend) {
                btn.innerText = "Memproses...";
                btn.disabled = true;
            } else {
                alertMsg.innerText = "Mengirim ulang email...";
                alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-blue-100 text-blue-700 border border-blue-200 block";
            }

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });
                const data = await res.json();

                if (res.ok) {
                    alertMsg.innerText = data.message;
                    alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-green-100 text-green-700 border border-green-200 block";
                    startResendTimer();
                } else {
                    alertMsg.innerText = data.error || 'Terjadi kesalahan.';
                    alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
                }
            } catch (err) {
                alertMsg.innerText = "Gagal terhubung ke server.";
                alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
            } finally {
                if (!isResend) {
                    btn.innerText = "Kirim Tautan Reset";
                    btn.disabled = false;
                }
            }
        }

        document.getElementById('forgotForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('email').value;
            sendResetRequest(emailInput, false);
        });

        document.getElementById('btnResend').addEventListener('click', () => {
            const emailInput = document.getElementById('email').value;
            sendResetRequest(emailInput, true);
            startResendTimer();
        });
    </script>
</body>
</html>
