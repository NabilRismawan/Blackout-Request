<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Sistem Manajemen Pemadaman</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-inalum-dashboard.png">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#F8FAFC',
                        foreground: '#0F172A',
                        border: '#E2E8F0',
                        inalum: {
                            blue: '#0A457F',
                            bluehover: '#083663',
                            green: '#009A44'
                        }
                    },
                    fontFamily: { sans: ['Satoshi', 'sans-serif'] },
                }
            }
        };
    </script>
</head>
<body class="bg-background text-foreground flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-3xl border border-border w-full max-w-md shadow-lg my-8">
        <div class="text-center mb-8 flex flex-col items-center">
            <img src="/logo-inalum-login.png" alt="Logo INALUM" class="h-12 w-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold tracking-tight text-inalum-blue">Buat Akun Baru</h1>
            <p class="text-sm text-gray-500 mt-2">Daftar untuk mengakses sistem</p>
        </div>

        <div id="alertMsg" class="hidden text-center text-sm font-medium p-3 rounded-xl mb-4"></div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Nama Lengkap / Username</label>
                <input type="text" id="username" required class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors" placeholder="Cth: Budi Santoso">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Alamat Email Aktif</label>
                <input type="email" id="email" required class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors" placeholder="nama@email.com">
            </div>
            
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Kata Sandi</label>
                <input type="password" id="password" required class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors" placeholder="Masukkan kata sandi">
                
                <div class="mt-3 p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-2 font-medium">Syarat Kata Sandi:</p>
                    <ul class="text-xs space-y-1.5">
                        <li id="req-length" class="flex items-center gap-2 text-gray-400 transition-colors duration-300">
                            <span class="indicator-icon">○</span> Minimal 6 karakter
                        </li>
                        <li id="req-case" class="flex items-center gap-2 text-gray-400 transition-colors duration-300">
                            <span class="indicator-icon">○</span> Huruf besar (A-Z) & kecil (a-z)
                        </li>
                        <li id="req-number" class="flex items-center gap-2 text-gray-400 transition-colors duration-300">
                            <span class="indicator-icon">○</span> Mengandung angka (0-9)
                        </li>
                        <li id="req-special" class="flex items-center gap-2 text-gray-400 transition-colors duration-300">
                            <span class="indicator-icon">○</span> Karakter spesial (!@#$%^&*)
                        </li>
                    </ul>
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Peran (Role)</label>
                <select id="role" class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors bg-white">
                    <option value="pemohon">Pemohon (Staff)</option>
                    <option value="pemeriksa">Pemeriksa (Supervisor)</option>
                    <option value="penyetuju">Penyetuju (Manager)</option>
                </select>
            </div>
            
            <button type="submit" id="btnSubmit" disabled class="w-full bg-gray-300 text-gray-500 py-3.5 rounded-full text-xs uppercase tracking-widest font-bold cursor-not-allowed transition-all duration-300 shadow-sm">
                Daftar Sekarang
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">Sudah punya akun? <a href="/login.html" class="text-inalum-blue font-bold hover:underline">Masuk di sini</a></p>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const btnSubmit = document.getElementById('btnSubmit');

        const reqLength = document.getElementById('req-length');
        const reqCase = document.getElementById('req-case');
        const reqNumber = document.getElementById('req-number');
        const reqSpecial = document.getElementById('req-special');

        function updateIndicator(element, isValid) {
            const icon = element.querySelector('.indicator-icon');
            if (isValid) {
                element.classList.remove('text-gray-400');
                element.classList.add('text-inalum-green', 'font-bold');
                icon.innerText = '✓';
            } else {
                element.classList.remove('text-inalum-green', 'font-bold');
                element.classList.add('text-gray-400');
                icon.innerText = '○';
            }
        }

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;

            const isLengthValid = val.length >= 6;
            const isCaseValid = /[a-z]/.test(val) && /[A-Z]/.test(val); 
            const isNumberValid = /[0-9]/.test(val); 
            const isSpecialValid = /[!@#$%^&*(),.?":{}|<>]/.test(val); 

            updateIndicator(reqLength, isLengthValid);
            updateIndicator(reqCase, isCaseValid);
            updateIndicator(reqNumber, isNumberValid);
            updateIndicator(reqSpecial, isSpecialValid);

            const allValid = isLengthValid && isCaseValid && isNumberValid && isSpecialValid;
            
            if (allValid) {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                btnSubmit.classList.add('bg-inalum-blue', 'hover:bg-inalum-bluehover', 'text-white');
            } else {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                btnSubmit.classList.remove('bg-inalum-blue', 'hover:bg-inalum-bluehover', 'text-white');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (btnSubmit.disabled) return;

            const alertMsg = document.getElementById('alertMsg');
            const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: passwordInput.value,
                role: document.getElementById('role').value
            };

            const originalBtnClass = btnSubmit.className;
            btnSubmit.innerText = "Memproses...";
            btnSubmit.disabled = true;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    alertMsg.innerText = data.message;
                    alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-green-100 text-green-700 border border-green-200 block";
                    document.getElementById('registerForm').reset();
                    passwordInput.dispatchEvent(new Event('input')); 
                } else {
                    alertMsg.innerText = data.error;
                    alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
                    btnSubmit.className = originalBtnClass;
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Daftar Sekarang";
                }
            } catch (err) {
                alertMsg.innerText = "Gagal terhubung ke server.";
                alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
                btnSubmit.className = originalBtnClass;
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Daftar Sekarang";
            }
        });
    </script>
</body>
</html>
