<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Sandi Baru - Sistem Manajemen Pemadaman</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-inalum-dashboard.png">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#F8FAFC',
                        foreground: '#0F172A',
                        border: '#E2E8F0',
                        inalum: {
                            blue: '#0A457F',
                            bluehover: '#083663',
                            green: '#009A44'
                        }
                    },
                    fontFamily: { sans: ['Satoshi', 'sans-serif'] },
                }
            }
        };
    </script>
</head>
<body class="bg-background text-foreground flex items-center justify-center min-h-screen p-4">

    <div class="hidden text-green-600 bg-inalum-blue hover:bg-inalum-bluehover text-white bg-gray-300 text-gray-500 text-gray-400"></div>

    <div class="bg-white p-8 rounded-3xl border border-border w-full max-w-md shadow-lg my-8">
        <div class="text-center mb-8 flex flex-col items-center">
            <img src="/logo-inalum-login.png" alt="Logo INALUM" class="h-12 w-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold tracking-tight text-inalum-blue">Buat Sandi Baru</h1>
            <p class="text-sm text-gray-500 mt-2">Silakan masukkan kata sandi baru yang kuat untuk akun Anda.</p>
        </div>

        <div id="alertMsg" class="hidden text-center text-sm font-medium p-3 rounded-xl mb-4"></div>

        <form id="resetForm" class="space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Kata Sandi Baru</label>
                <input type="password" id="newPassword" required class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors" placeholder="Masukkan kata sandi baru">
                
                <div class="mt-3 p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-2 font-medium">Syarat Kata Sandi:</p>
                    <ul class="text-xs space-y-1.5">
                        <li id="req-length" class="flex items-center gap-2 text-gray-400 transition-colors duration-300">
                            <span class="indicator-icon">○</span> Minimal 6 karakter
                        </li>
                        <li id="req-case" class="flex items-center gap-2 text-gray-400 transition-colors duration-300">
                            <span class="indicator-icon">○</span> Huruf besar (A-Z) & kecil (a-z)
                        </li>
                        <li id="req-number" class="flex items-center gap-2 text-gray-400 transition-colors duration-300">
                            <span class="indicator-icon">○</span> Mengandung angka (0-9)
                        </li>
                        <li id="req-special" class="flex items-center gap-2 text-gray-400 transition-colors duration-300">
                            <span class="indicator-icon">○</span> Karakter spesial (!@#$%^&*)
                        </li>
                    </ul>
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Konfirmasi Kata Sandi Baru</label>
                <input type="password" id="confirmPassword" required class="w-full border border-border p-3 rounded-xl focus:outline-none focus:border-inalum-blue transition-colors" placeholder="Ulangi kata sandi baru">
                <p id="matchError" class="text-xs text-red-500 mt-2 hidden">Kata sandi tidak cocok.</p>
            </div>
            
            <button type="submit" id="btnSubmit" disabled class="w-full bg-gray-300 text-gray-500 py-3.5 rounded-full text-xs uppercase tracking-widest font-bold cursor-not-allowed transition-all duration-300 shadow-sm">
                Penuhi Syarat Sandi
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const btnSubmit = document.getElementById('btnSubmit');
        const matchError = document.getElementById('matchError');

        const reqLength = document.getElementById('req-length');
        const reqCase = document.getElementById('req-case');
        const reqNumber = document.getElementById('req-number');
        const reqSpecial = document.getElementById('req-special');

        if (!token) {
            document.getElementById('alertMsg').innerText = "Token reset tidak ditemukan pada tautan.";
            document.getElementById('alertMsg').className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
            btnSubmit.disabled = true;
            newPasswordInput.disabled = true;
            confirmPasswordInput.disabled = true;
        }

        function updateIndicator(element, isValid) {
            const icon = element.querySelector('.indicator-icon');
            if (isValid) {
                element.classList.remove('text-gray-400');
                element.classList.add('text-green-600', 'font-bold');
                icon.innerText = '✓';
            } else {
                element.classList.remove('text-green-600', 'font-bold');
                element.classList.add('text-gray-400');
                icon.innerText = '○';
            }
        }

        function validatePassword() {
            const val = newPasswordInput.value;
            const confirmVal = confirmPasswordInput.value;

            // Logika Syarat Sandi
            const isLengthValid = val.length >= 6;
            const isCaseValid = /[a-z]/.test(val) && /[A-Z]/.test(val); 
            const isNumberValid = /[0-9]/.test(val); 
            const isSpecialValid = /[!@#$%^&*(),.?":{}|<>]/.test(val); 

            updateIndicator(reqLength, isLengthValid);
            updateIndicator(reqCase, isCaseValid);
            updateIndicator(reqNumber, isNumberValid);
            updateIndicator(reqSpecial, isSpecialValid);

            const isPasswordStrong = isLengthValid && isCaseValid && isNumberValid && isSpecialValid;
            const isMatch = val === confirmVal && confirmVal !== "";

            // Menampilkan peringatan jika konfirmasi sandi diketik tetapi tidak cocok
            if (!isMatch && confirmVal.length > 0) {
                matchError.classList.remove('hidden');
            } else {
                matchError.classList.add('hidden');
            }

            // Atur status tombol submit
            if (isPasswordStrong && isMatch) {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Simpan Kata Sandi";
                btnSubmit.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                btnSubmit.classList.add('bg-inalum-blue', 'hover:bg-inalum-bluehover', 'text-white');
            } else {
                btnSubmit.disabled = true;
                btnSubmit.innerText = !isPasswordStrong ? "Penuhi Syarat Sandi" : "Sandi Belum Cocok";
                btnSubmit.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                btnSubmit.classList.remove('bg-inalum-blue', 'hover:bg-inalum-bluehover', 'text-white');
            }
        }

        // Jalankan validasi secara real-time
        newPasswordInput.addEventListener('input', validatePassword);
        confirmPasswordInput.addEventListener('input', validatePassword);

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (btnSubmit.disabled || !token) return;
            
            const alertMsg = document.getElementById('alertMsg');
            const originalBtnClass = btnSubmit.className;

            btnSubmit.innerText = "Menyimpan...";
            btnSubmit.disabled = true;

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: newPasswordInput.value })
                });
                const data = await res.json();

                if (res.ok) {
                    alertMsg.innerText = data.message + " Mengarahkan ke halaman login...";
                    alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-green-100 text-green-700 border border-green-200 block";
                    document.getElementById('resetForm').reset();
                    
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 3000);
                } else {
                    alertMsg.innerText = data.error || 'Tautan tidak valid atau kedaluwarsa.';
                    alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
                    btnSubmit.className = originalBtnClass;
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Simpan Kata Sandi";
                }
            } catch (err) {
                alertMsg.innerText = "Gagal terhubung ke server.";
                alertMsg.className = "text-center text-sm font-medium p-3 rounded-xl mb-4 bg-red-100 text-red-700 border border-red-200 block";
                btnSubmit.className = originalBtnClass;
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Simpan Kata Sandi";
            }
        });
    </script>
</body>
</html>
